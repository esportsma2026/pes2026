<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#6C3CE1"/>
      <stop offset="100%" style="stop-color:#4A1FA8"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Logo icon - stylized football -->
  <g filter="url(#shadow)">
    <circle cx="40" cy="40" r="36" fill="url(#lg)"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Football hexagon pattern -->
    <polygon points="40,18 52,26 52,42 40,50 28,42 28,26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <polygon points="40,30 46,34 46,42 40,46 34,42 34,34" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Center badge -->
    <circle cx="40" cy="38" r="12" fill="rgba(255,255,255,0.1)"/>
    <text x="40" y="43" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">⚽</text>
  </g>
  <!-- Brand text -->
  <text x="90" y="52" font-family="'Orbitron','Arial Black',sans-serif" font-size="42" font-weight="900" fill="white" letter-spacing="3" filter="url(#shadow)">EFFOTBALE</text>
  <!-- Tagline -->
  <text x="90" y="72" font-family="'Inter',Arial,sans-serif" font-size="13" fill="#8B5CF6" letter-spacing="6" font-weight="600">WORLD CUP 2026</text>
</svg>
